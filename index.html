<title>Birthday Surprise 💜</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background: #d8c0f2;
  color: #555;
  overflow-x: hidden;
}

/* =========================
   MAIN BROWSER
========================= */

.browser {
  width: min(430px, 100%);
  min-height: 100vh;
  margin: auto;
  background: white;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(70, 40, 100, .2);
}

/* =========================
   BROWSER HEADER
========================= */

.browser-top {
  background: #111;
  padding: 10px 12px 8px;
}

.dots {
  display: flex;
  gap: 7px;
  margin-bottom: 8px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #777;
}

.address {
  background: #292929;
  color: white;
  border-radius: 9px;
  padding: 9px;
  text-align: center;
  font-size: 12px;
}

.caption {
  background: #111;
  color: white;
  text-align: center;
  padding: 13px;
  font-size: 14px;
}

/* =========================
   SCREENS
========================= */

.screen {
  display: none;
  min-height: calc(100vh - 95px);
  padding: 30px 20px;
  text-align: center;
  position: relative;
}

.screen.active {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1,
h2 {
  color: #d94c91;
}

h1 {
  font-size: 31px;
  margin-bottom: 15px;
}

h2 {
  font-size: 27px;
  margin-bottom: 15px;
}

p {
  line-height: 1.6;
}

.main-btn,
.yes-btn,
.no-btn {
  border: none;
  border-radius: 16px;
  padding: 14px 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.main-btn,
.yes-btn {
  background: #e94d91;
  color: white;
  box-shadow: 0 6px 15px rgba(220, 60, 130, .25);
}

.no-btn {
  background: #eee;
  color: #555;
}

.main-btn {
  margin-top: 25px;
}

.main-btn:active,
.yes-btn:active,
.no-btn:active {
  transform: scale(.96);
}

/* =====================================================
   FIRST PAGE — LAVENDER / YELLOW STRIPED DESIGN
===================================================== */

.first-page {
  min-height: calc(100vh - 95px);
  padding: 0;
  overflow: hidden;

  background:
    repeating-linear-gradient(
      90deg,
      #c9a8e8 0px,
      #c9a8e8 65px,
      #fff6bd 65px,
      #fff6bd 130px
    );
}

/* soft dreamy overlay */

.first-page::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(255,255,255,.35),
      transparent 25%
    ),
    radial-gradient(
      circle at 80% 80%,
      rgba(130,80,180,.15),
      transparent 30%
    );

  pointer-events: none;
}

/* UNLOCK */

.unlock-title {
  position: absolute;
  top: 35px;
  left: 27px;
  z-index: 4;
  text-align: left;
}

.unlock-title span {
  display: block;
  color: #7054b5;
  font-family: Georgia, serif;
  font-weight: bold;
  font-size: 50px;
  line-height: .8;
}

.unlock-title i {
  display: block;
  color: white;
  font-family: cursive;
  font-size: 46px;
  margin-left: 42px;
  transform: rotate(-8deg);
}

.unlock-title b {
  display: block;
  color: #7459b8;
  font-family: cursive;
  font-size: 25px;
  margin-left: 82px;
  margin-top: -4px;
}

/* PHOTO FRAME */

.photo-frame {
  position: absolute;
  left: 18px;
  top: 225px;

  width: 185px;
  height: 230px;

  padding: 11px;

  background: #8b68cf;

  border-radius: 45% 45% 48% 48%;

  box-shadow:
    0 0 0 4px #ddcbff,
    0 0 0 7px #8060c5,
    0 10px 22px rgba(70,40,120,.25);

  overflow: hidden;
  z-index: 3;
}

.photo-frame::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 3px solid #eee4ff;
  border-radius: 45%;
  pointer-events: none;
  z-index: 2;
}

.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 40%;
}

/* PASSCODE CARD */

.passcode-card {
  position: absolute;
  top: 55px;
  right: 16px;

  width: 185px;
  min-height: 410px;

  padding: 24px 14px;

  background: rgba(255,249,190,.94);

  border: 5px solid #7455bb;
  border-radius: 35px;

  z-index: 5;

  box-shadow:
    0 8px 20px rgba(70,40,120,.2);
}

.passcode-card::before {
  content: "";
  position: absolute;
  inset: -10px;
  border: 3px solid #8b6bc7;
  border-radius: 42px;
  pointer-events: none;
}

.passcode-card h3 {
  position: relative;
  z-index: 2;
  color: #6750aa;
  font-size: 17px;
  margin-bottom: 15px;
}

/* PASSWORD DISPLAY */

.passcode-display {
  position: relative;
  z-index: 2;

  display: flex;
  justify-content: center;
  gap: 7px;

  margin-bottom: 18px;
}

.passcode-display span {
  width: 27px;
  height: 27px;

  background: #7355bd;
  border-radius: 4px;

  color: white;
  font-size: 18px;
  line-height: 27px;
}

/* FIRST KEYPAD */

.first-keypad {
  position: relative;
  z-index: 2;

  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.first-keypad button {
  height: 43px;

  border: none;
  border-radius: 50%;

  background: rgba(255,255,255,.7);

  color: #7057b4;

  font-size: 17px;
  font-weight: bold;

  cursor: pointer;
}

.first-keypad button:active {
  transform: scale(.9);
}

/* ERROR */

.error {
  position: relative;
  z-index: 3;
  color: #d83f65;
  font-size: 12px;
  margin-top: 12px;
}

/* CUTE DECORATION */

.cute-sticker {

  left: 52%;
  bottom: 55px;

.cute-sticker span {

/* =========================

@keyframes floatHeart {

<script>

const correctPassword = "1234";

let enteredPassword = "";


/* =========================
   PASSWORD
========================= */

function pressKey(number) {

  if (enteredPassword.length >= 4) {
    return;
  }

  enteredPassword += number;

  updatePasswordDisplay();

  document.getElementById("passwordError").textContent = "";

  if (enteredPassword.length === 4) {

    setTimeout(function() {
      checkPassword();
    }, 200);

  }
}


function updatePasswordDisplay() {

  const boxes = [
    document.getElementById("p1"),
    document.getElementById("p2"),
    document.getElementById("p3"),
    document.getElementById("p4")
  ];

  boxes.forEach(function(box, index) {

    if (index < enteredPassword.length) {
      box.textContent = "•";
    } else {
      box.textContent = "";
    }

  });

}


function clearPassword() {

  enteredPassword =
    enteredPassword.slice(0, -1);

  updatePasswordDisplay();

  document.getElementById("passwordError").textContent = "";

}


function checkPassword() {

  if (enteredPassword === correctPassword) {

    document.getElementById("passwordError").textContent = "";

    showScreen("question");

  } else {

    document.getElementById("passwordError").textContent =
      "Wrong password 😭 Try again!";

    enteredPassword = "";

    updatePasswordDisplay();

  }

}


/* =========================
   SCREEN CONTROL
========================= */

function showScreen(screenId) {

  const screens =
    document.querySelectorAll(".screen");

  screens.forEach(function(screen) {

    selected.classList.add("active");

  }

  window.scrollTo(0, 0);

  createHearts();

}


/* =========================
   YES
========================= */

function answerYes() {

  const message =
    document.getElementById("questionMessage");

  message.textContent =
    "YAYYY! 🥹💜 Opening your surprise...";

  createHearts();

  setTimeout(function() {

    showScreen("birthday");

  }, 700);

}


/* =========================
   NO
========================= */

function answerNo() {

  const message =
    document.getElementById("questionMessage");

  message.textContent =
    "Okay 😤 I'll respect that... I'll be here whenever you're ready 🥺💜";

}


/* =========================
   STICKERS
========================= */

function stickerClick(type) {

  const message =
    document.getElementById("stickerMessage");

  const messages = {

    camera:
      "📸 Every beautiful moment deserves to be remembered.",

    envelope:
      "💌 A little secret message: you're very special.",

    phone:
      "📱 Imagine this arriving at 12am.",

    flowers:
      "💐 These flowers are for you because you deserve something beautiful."

  };

  message.textContent =
    messages[type] || "💜 Surprise!";

  createHearts();

}


/* =========================
   FLOATING HEARTS
========================= */

function createHearts() {

  for (let i = 0; i < 5; i++) {

    const heart =
      document.createElement("div");

    heart.className =
      "floating-heart";

    heart.textContent =
      Math.random() > .5 ? "💜" : "💗";

    heart.style.left =
      (20 + Math.random() * 60) + "%";

    heart.style.bottom =
      "20px";

    heart.style.animationDelay =
      (Math.random() * .5) + "s";

    document.body.appendChild(heart);

    setTimeout(function() {

      heart.remove();

    }, 3500);

  }

}


/* =========================
   REPLAY
========================= */

function replaySurprise() {

  const video =
    document.getElementById("birthdayVideo");

  if (video) {

    video.pause();

    video.currentTime = 0;

  }

  enteredPassword = "";

  updatePasswordDisplay();

  document.getElementById("passwordError").textContent = "";

  document.getElementById("questionMessage").textContent = "";

  document.getElementById("stickerMessage").textContent = "";

  showScreen("passcode");

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown", function(event) {

  if (/^[0-9]$/.test(event.key)) {

    pressKey(event.key);

  }

  if (event.key === "Backspace") {

    clearPassword();

  }

  if (event.key === "Enter") {

    checkPassword();

  }

});


/* =========================
   START
========================= */

updatePasswordDisplay();

</script>
