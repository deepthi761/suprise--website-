<!DOCTYPE html>
<html lang="en">
<head>
    <script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 💗</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#111;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
}

#app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#fff4f8;
    overflow:hidden;
    position:relative;
}

.top-caption{
    background:#111;
    color:white;
    padding:10px 12px;
    font-size:11px;
    text-align:center;
}

.browser-bar{
    height:48px;
    background:#f8f8f8;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 12px;
    gap:8px;
    position:relative;
    z-index:10;
}

.browser-dots{
    display:flex;
    gap:5px;
}

.browser-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#bbb;
}

.address{
    flex:1;
    height:28px;
    border-radius:15px;
    background:#fff;
    border:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 12px;
    font-size:11px;
    color:#888;
}


/* =====================================================
   SCREENS
===================================================== */

.screen{
    display:none;
    min-height:calc(100vh - 48px);
    padding:28px 20px;
    text-align:center;
}

.screen.active{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

h1{
    color:#ff4f87;
    margin-bottom:14px;
}

p{
    color:#666;
    line-height:1.6;
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{
    border:0;
    padding:14px 25px;
    border-radius:30px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:18px;
}

.primary{
    background:#ff5b91;
    color:white;
    box-shadow:0 7px 18px rgba(255,91,145,.3);
}

.secondary{
    background:white;
    color:#ff4f87;
    border:2px solid #ffb0c8;
}

.btn:active{
    transform:scale(.96);
}


/* =====================================================
   PASSWORD
===================================================== */

.teddy{
    font-size:92px;
    margin-bottom:15px;
}

.password-title{
    color:#ff4f87;
    font-size:25px;
    font-weight:bold;
}

.password-subtitle{
    margin-top:7px;
    font-size:14px;
}

.pin{
    display:flex;
    gap:9px;
    margin:20px 0 8px;
}

.pin-box{
    width:48px;
    height:55px;
    background:white;
    border:2px solid #ff9fba;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#ff4f87;
    font-size:25px;
}

.error{
    height:24px;
    color:#ff315f;
    font-size:13px;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3,65px);
    gap:11px;
    justify-content:center;
    margin-top:5px;
}

.key{
    width:65px;
    height:54px;
    border:0;
    border-radius:15px;
    background:white;
    color:#ff4f87;
    font-size:19px;
    font-weight:bold;
    box-shadow:0 5px 12px rgba(255,170,195,.35);
    cursor:pointer;
}

.key:active{
    transform:scale(.92);
}


/* =====================================================
   YES / NO
===================================================== */

.question-card{
    width:100%;
    background:white;
    border-radius:30px;
    padding:30px 20px;
    box-shadow:0 10px 30px rgba(255,130,165,.2);
}

.question-emoji{
    font-size:70px;
    margin-bottom:10px;
}

.question-card h1{
    font-size:27px;
}

.answer-message{
    min-height:45px;
    margin-top:15px;
    color:#ff4f87;
    font-weight:bold;
}


/* =====================================================
   BIRTHDAY
===================================================== */

.birthday-title{
    font-size:44px;
    line-height:1;
    font-weight:900;
    color:#ff4f87;
    text-shadow:3px 3px white;
}

.birthday-subtitle{
    margin-top:15px;
    font-size:17px;
}


/* =====================================================
   CUTE MODEL
===================================================== */

.model{
    width:210px;
    height:270px;
    margin:25px auto;
    position:relative;
    border-radius:110px 110px 30px 30px;
    background:linear-gradient(
        to bottom,
        #f2c09f 0 38%,
        #222 38% 55%,
        #ff739c 55% 100%
    );
    box-shadow:0 12px 30px rgba(255,120,160,.25);
}

.model-face{
    position:absolute;
    width:105px;
    height:125px;
    background:#f2c09f;
    border-radius:50%;
    top:24px;
    left:52px;
    z-index:2;
}

.model-hair{
    position:absolute;
    width:175px;
    height:110px;
    background:#222;
    border-radius:100px 100px 20px 20px;
    top:0;
    left:17px;
    z-index:1;
}

.model-body{
    position:absolute;
    width:150px;
    height:130px;
    background:#ff739c;
    border-radius:70px 70px 20px 20px;
    bottom:0;
    left:30px;
}


/* =====================================================
   MEMORIES
===================================================== */

.memory-grid{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:20px 0;
}

.memory{
    height:155px;
    border-radius:20px;
    overflow:hidden;
    background:#ffd9e5;
    position:relative;
}

.memory img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.memory-number{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    color:#ff709d;
}


/* =====================================================
   LETTER
===================================================== */

.letter{
    width:100%;
    background:#fff;
    border-radius:25px;
    padding:25px;
    text-align:left;
    box-shadow:0 8px 25px rgba(255,130,165,.18);
    color:#555;
    line-height:1.75;
    margin:10px 0;
}

.letter-title{
    color:#ff4f87;
    font-size:21px;
    font-weight:bold;
    margin-bottom:15px;
}


/* =====================================================
   STICKERS
===================================================== */

.sticker-grid{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin:25px 0;
}

.sticker{
    height:130px;
    background:white;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    box-shadow:0 8px 20px rgba(255,140,170,.2);
    cursor:pointer;
    transition:.2s;
}

.sticker:active{
    transform:scale(.93) rotate(-3deg);
}


/* =====================================================
   VIDEO
===================================================== */

.video-wrapper{
    width:100%;
    margin:20px 0;
    background:#111;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.video-wrapper video{
    width:100%;
    display:block;
    max-height:500px;
    background:#000;
}


/* =====================================================
   FINAL VIRTUAL HUG GIF
===================================================== */

.hug-heading{
    font-size:25px;
    margin-bottom:15px;
}

.virtual-hug{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:5px auto 20px;
}

.hug-gif{
    width:100%;
    max-width:360px;
    height:auto;
    display:block;
    border-radius:20px;
}

.final-title{
    color:#ff4f87;
    font-size:28px;
    font-weight:bold;
}

.final-text{
    margin-top:12px;
}


/* =====================================================
   POPUP
===================================================== */

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:center;
    padding:25px;
    z-index:100;
}

.popup.show{
    display:flex;
}

.popup-card{
    width:100%;
    max-width:340px;
    background:white;
    border-radius:25px;
    padding:30px;
    text-align:center;
}

.popup-card h2{
    color:#ff4f87;
    margin-bottom:12px;
}

.close{
    border:0;
    background:#ff5b91;
    color:white;
    padding:12px 24px;
    border-radius:25px;
    margin-top:20px;
}


/* =====================================================
   REPLAY
===================================================== */

.replay{
    margin-top:18px;
    background:white;
    color:#ff4f87;
    border:2px solid #ffb1c8;
    padding:12px 23px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

</style>
</head>

<script>

/* =====================================================
   PASSWORD
===================================================== */

const correctPassword = "1234";

let enteredPassword = "";


/* =====================================================
   SCREEN NAVIGATION
===================================================== */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(function(screen){

            screen.classList.remove("active");

        });


    const target =
        document.getElementById(id);


    if(target){

        target.classList.add("active");
window.scrollTo(0,0);

    }

}


/* =====================================================
   PASSWORD KEYPAD
===================================================== */

function press(number){

    if(enteredPassword.length >= 4){
        return;
    }


    enteredPassword += number;

    updatePin();

    document
        .getElementById("passwordError")
        .innerText = "";


    if(enteredPassword.length === 4){

        setTimeout(function(){

            checkPassword();

        },200);

    }

}


/* =====================================================
   UPDATE PIN
===================================================== */

function updatePin(){

    const boxes = [

        document.getElementById("pin1"),
        document.getElementById("pin2"),
        document.getElementById("pin3"),
        document.getElementById("pin4")

    ];


    boxes.forEach(function(box,index){

        if(index < enteredPassword.length){

            box.innerText = "•";

        }else{

            box.innerText = "";

        }

    });

}


/* =====================================================
   CLEAR PASSWORD
===================================================== */

function clearPassword(){

    enteredPassword = "";

    updatePin();

    document
        .getElementById("passwordError")
        .innerText = "";

}


/* =====================================================
   CHECK PASSWORD
===================================================== */

function checkPassword(){

    if(enteredPassword === correctPassword){

        document
            .getElementById("passwordError")
            .innerText = "";

        showScreen("question");

    }else{

        document
            .getElementById("passwordError")
            .innerText =
            "Wrong password 😭 Try again!";

        enteredPassword = "";

        updatePin();

    }

}


/* =====================================================
   YES
===================================================== */

function answerYes(){

    const message =
        document.getElementById("answerMessage");


    message.innerText =
        "YAYYY! 🥹💗 Opening your surprise...";


    setTimeout(function(){

        showScreen("birthday");

    },700);

}


/* =====================================================
   NO
===================================================== */

function answerNo(){

    document
        .getElementById("answerMessage")
        .innerText =
        "Okay 😤 I'll respect that... I'll be here whenever you're ready 🥺💗";

}


/* =====================================================
   POPUP
===================================================== */

function openPopup(title,text){

    document
        .getElementById("popupTitle")
        .innerText = title;


    document
        .getElementById("popupText")
        .innerText = text;


    document
        .getElementById("popup")
        .classList.add("show");

}


function closePopup(){

    document
        .getElementById("popup")
        .classList.remove("show");

}


/* =====================================================
   REPLAY
===================================================== */

function replay(){

    const video =
        document.querySelector("#video video");


    if(video){

        video.pause();

        video.currentTime = 0;

    }


    closePopup();

    enteredPassword = "";

    updatePin();


    document
        .getElementById("passwordError")
        .innerText = "";


    document
        .getElementById("answerMessage")
        .innerText = "";


    showScreen("passcode");

}

</script>
